<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme: dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文档问答 · docqa</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #161a21;
    --bg-card: #1b2029;
    --bg-code: #10131a;
    --line: #262d38;
    --line-soft: #1f2530;
    --fg: #e6e9ef;
    --fg-dim: #9aa4b2;
    --fg-faint: #6b7482;
    --accent: #5b9dff;
    --accent-soft: #1d2b45;
    --ok: #46c98b;
    --warn: #e2b04a;
    --err: #f2707a;
    --think: #b48ef0;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }

  /* ---------------------------------------------------------------- sidebar */
  aside {
    width: 336px; flex: 0 0 336px; background: var(--bg-soft);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .brand { padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft); }
  .brand h1 { margin: 0; font-size: 16px; letter-spacing: .2px; }
  .brand p { margin: 4px 0 0; font-size: 12px; color: var(--fg-faint); }
  .pane { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .pane h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px;
    color: var(--fg-faint); margin: 0 0 10px; font-weight: 600;
  }
  .pane section + section { margin-top: 22px; }

  /* 拖放整窗高亮：拖到窗口任意位置都能上传，不必对准某个框 */
  #veil {
    position: fixed; inset: 0; z-index: 90; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 12, 20, .62); box-shadow: inset 0 0 0 2px var(--accent);
    color: var(--fg); font-size: 15px; letter-spacing: .4px;
  }
  #veil[hidden] { display: none; }

  .doc {
    display: flex; gap: 10px; padding: 9px 10px; border-radius: 9px;
    background: var(--bg-card); margin-bottom: 7px; font-size: 12.5px; align-items: flex-start;
  }
  .doc-ico { font-size: 15px; line-height: 1.3; }
  .doc-body { min-width: 0; flex: 1; }
  .doc-name { color: var(--fg); word-break: break-all; }
  .doc-meta { color: var(--fg-faint); font-size: 11.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--bg-soft); border: 1px solid var(--line);
    padding: 0 6px; border-radius: 20px; font-size: 10.5px; color: var(--fg-dim);
  }
  .chip.engine { border-color: #33507d; color: #8fb8ff; }
  .chip.warn { border-color: #6b5320; color: var(--warn); }

  .btnrow { display: flex; gap: 8px; }
  button.ghost {
    flex: 1; background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; cursor: pointer; font-size: 12.5px; color: var(--fg-dim);
  }
  button.ghost:hover { border-color: var(--accent); color: var(--fg); }
  button.ghost:disabled { opacity: .45; cursor: not-allowed; }
  .meta { font-size: 11.5px; color: var(--fg-faint); }
  .meta code { color: var(--fg-dim); }
  .warn-line { color: var(--warn); font-size: 11.5px; margin-top: 6px; }

  /* ------------------------------------------------------------------- main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 28px 0 12px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }

  .empty { text-align: center; color: var(--fg-faint); padding: 80px 20px; font-size: 13.5px; }
  .empty b { display: block; font-size: 17px; color: var(--fg-dim); margin-bottom: 8px; font-weight: 600; }

  .msg { margin-bottom: 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--accent-soft); border: 1px solid #2b4066;
    padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 76%; white-space: pre-wrap;
  }
  .msg-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .msg.user .bubble > .msg-files:first-child { margin-top: 0; }
  .msg-file {
    display: inline-flex; align-items: center; gap: 5px; max-width: 230px;
    background: var(--bg-card); border: 1px solid var(--line); border-radius: 8px;
    padding: 3px 8px; font-size: 11.5px; color: var(--fg-dim); white-space: nowrap;
  }
  .msg-file .nm { overflow: hidden; text-overflow: ellipsis; }
  .msg-file .sz { color: var(--fg-faint); }

  /* 入库结果：作为对话流里的一条系统提示，而不是侧栏里的裸日志 */
  .notice {
    border: 1px solid var(--line); background: var(--bg-soft); border-radius: 10px;
    padding: 10px 13px; margin: 0 0 20px; font-size: 12.5px; color: var(--fg-dim);
  }
  .notice b { display: block; color: var(--fg); margin-bottom: 5px; }
  .notice .line { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 4px; }
  .notice .ok { color: #7ee0a6; }
  .notice .bad { color: #ffb3b8; }

  /* 状态行：贴在事件流上方，取代原来把整轮包起来的大卡片 */
  .run-status {
    display: flex; align-items: center; gap: 10px; margin: 2px 0 12px;
    font-size: 12px; color: var(--fg-dim);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: 20px; font-size: 11.5px;
    background: var(--bg-card); border: 1px solid var(--line); color: var(--fg-dim);
  }
  .badge.run { border-color: #33507d; color: #9cc2ff; }
  .badge.ok { border-color: #2c6047; color: var(--ok); }
  .badge.bad { border-color: #6b2f36; color: var(--err); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.run .dot { animation: pulse 1.15s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .28; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .spacer { flex: 1; }
  .elapsed { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }

  /* ------------------------------------------------------------------ 事件行
     思考 / 工具调用 / 工具结果都是对话流里的一条独立行，到了就追加，
     和 DSH 的对话 UI 一样：一行一个事件，可点开看细节。 */
  .ev {
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg-card);
    margin: 8px 0; overflow: hidden; font-size: 13px;
  }
  .ev-head {
    display: flex; align-items: center; gap: 9px; padding: 8px 12px;
    cursor: pointer; list-style: none; user-select: none;
  }
  .ev-head::-webkit-details-marker { display: none; }
  .ev-ico { flex: 0 0 auto; font-size: 13.5px; line-height: 1; }
  .ev-label { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--accent); }
  .ev-detail {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ev-state { flex: 0 0 auto; font-size: 11px; color: var(--fg-faint); }
  .ev.done .ev-state { color: var(--ok); }
  .ev.fail { border-color: #5c2b31; }
  .ev.fail .ev-state { color: var(--err); }
  .ev-body { border-top: 1px solid var(--line-soft); padding: 10px 12px; }
  .ev-body h4 { margin: 0 0 6px; font-size: 11px; color: var(--fg-faint); font-weight: 600; letter-spacing: .5px; }

  /* 思考行：同为事件行，摘要里给一行预览，点开看全文 */
  .ev.think { border-left: 2px solid var(--think); background: #191d2b; }
  .ev.think .ev-label { color: var(--think); font-weight: 500; }
  .ev.think .ev-detail { font-family: inherit; color: #a9a4c7; }
  .ev-body .think-full { white-space: pre-wrap; color: #c6c2de; font-size: 13px; }

  /* ---- 工具参数：按工具类型分化渲染 ---- */
  .tool-ico { font-size: 14px; line-height: 1; }
  .arg-stack { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .arg-row { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
  .arg-key {
    flex: 0 0 auto; color: var(--fg-faint); font-size: 11px; letter-spacing: .3px;
    min-width: 42px;
  }
  .arg-val {
    font-family: var(--mono); font-size: 12px; color: #cdd6e4;
    word-break: break-all; background: var(--bg-code); border: 1px solid var(--line-soft);
    border-radius: 6px; padding: 2px 7px;
  }
  .arg-val.path { color: #8fd6ff; }
  .arg-val.pattern { color: #ffd479; }
  .arg-desc { color: var(--fg-dim); font-size: 12px; margin-bottom: 2px; }
  pre.code.term { color: #b6e3a8; }
  .arg-diff { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .diff-line {
    font-family: var(--mono); font-size: 12px; border-radius: 6px; padding: 6px 9px;
    white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line-soft);
  }
  .diff-line.old { background: #21161a; color: #ffb3b8; border-color: #4b2830; }
  .diff-line.new { background: #14201a; color: #a9e8c4; border-color: #274634; }
  .todo-row { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; padding: 3px 0; }
  .todo-mark { flex: 0 0 auto; width: 14px; }
  .todo-row.done .todo-text { color: var(--fg-faint); text-decoration: line-through; }
  .todo-row.active .todo-text { color: var(--fg); }
  details.raw { margin-top: 4px; }
  details.raw > summary {
    cursor: pointer; color: var(--fg-faint); font-size: 11px; list-style: none; user-select: none;
  }
  details.raw > summary::-webkit-details-marker { display: none; }
  details.raw > summary::before { content: "▸ "; }
  details.raw[open] > summary::before { content: "▾ "; }

  /* 工具行：成功的结果默认收起（点开看参数与返回），失败自动展开 */
  .ev.fail .ev-body { border-top-color: #5c2b31; }
  pre.code {
    margin: 0 0 10px; background: var(--bg-code); border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 10px 12px; overflow-x: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.55; color: #cdd6e4; white-space: pre-wrap; word-break: break-word;
  }
  pre.code:last-child { margin-bottom: 0; }

  .md { font-size: 14.5px; }
  /* 正在流式接收的正文：末尾一个光标，提交后整段被权威文本替换 */
  .md.streaming::after {
    content: "▌"; color: var(--accent); margin-left: 1px;
    animation: caret 1s step-end infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .md.streaming::after { animation: none; } }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.35; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17.5px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
  .md p { margin: 9px 0; }
  .md ul, .md ol { margin: 9px 0; padding-left: 22px; }
  .md li { margin: 4px 0; }
  .md code {
    background: var(--bg-code); border: 1px solid var(--line-soft); border-radius: 5px;
    padding: 1px 5px; font-family: var(--mono); font-size: 12.5px;
  }
  .md pre.code code { border: 0; background: none; padding: 0; font-size: 12px; }
  .md blockquote {
    margin: 10px 0; padding: 2px 14px; border-left: 2px solid var(--line); color: var(--fg-dim);
  }
  .md table { border-collapse: collapse; margin: 12px 0; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 11px; text-align: left; }
  .md th { background: var(--bg-card); font-weight: 600; }
  .md hr { border: 0; border-top: 1px solid var(--line-soft); margin: 16px 0; }
  .md a { color: var(--accent); }

  /* ------------------------------------------------------------------ GenUI */
  .g-root {
    background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin: 14px 0; font-size: 13.5px;
  }
  .g-banner { font-weight: 600; color: var(--fg); margin-bottom: 10px; font-size: 14px; }
  .g-title { font-size: 13px; color: var(--fg); font-weight: 600; margin-bottom: 8px; }
  .g-col { display: flex; flex-direction: column; gap: 12px; }
  .g-row { display: flex; align-items: flex-start; gap: 12px; }
  .g-row.wrap { flex-wrap: wrap; }
  .g-row-spacer { flex: 1; }
  .g-grid { display: grid; gap: 12px; }
  .g-card { border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px; background: var(--bg-soft); }
  .g-card-title { font-size: 12.5px; font-weight: 600; color: var(--fg); margin-bottom: 8px; }
  .g-spacer { height: 8px; }
  .g-divider { border: 0; border-top: 1px solid var(--line-soft); margin: 12px 0; }
  .g-empty { color: var(--fg-faint); font-size: 12.5px; }
  .g-error { color: #ffb3b8; font-size: 12.5px; }

  .g-text-h1 { font-size: 19px; font-weight: 650; margin: 4px 0; }
  .g-text-h2 { font-size: 16.5px; font-weight: 650; margin: 4px 0; }
  .g-text-h3 { font-size: 14.5px; font-weight: 600; margin: 3px 0; }
  .g-text-body { font-size: 13.5px; margin: 2px 0; }
  .g-text-muted { font-size: 12.5px; color: var(--fg-dim); margin: 2px 0; }
  .g-text-caption { font-size: 11.5px; color: var(--fg-faint); margin: 2px 0; }

  .g-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 20px;
    font-size: 11.5px; border: 1px solid var(--line); background: var(--bg-soft); color: var(--fg-dim);
  }
  .g-tone-success { border-color: #2c6047; color: #7ee0a6; }
  .g-tone-warn, .g-tone-warning { border-color: #6b5320; color: var(--warn); }
  .g-tone-danger, .g-tone-error { border-color: #6b2f36; color: #ffb3b8; }
  .g-tone-accent, .g-tone-info { border-color: #33507d; color: #8fb8ff; }
  .g-avatar {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    border-radius: 50%; background: var(--accent-soft); border: 1px solid #2b4066; font-size: 11.5px; color: var(--fg);
  }
  .g-link { color: var(--accent); }
  .g-link-plain { color: var(--fg-dim); }

  .g-progress { display: flex; flex-direction: column; gap: 5px; }
  .g-progress-label { font-size: 12.5px; color: var(--fg-dim); }
  .g-progress-track { height: 8px; background: var(--bg-soft); border: 1px solid var(--line-soft); border-radius: 999px; overflow: hidden; }
  .g-progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .g-progress-value { font-family: var(--mono); font-size: 11.5px; color: var(--fg-faint); }

  .g-stat { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg-soft); }
  .g-stat-label { font-size: 11.5px; color: var(--fg-faint); }
  .g-stat-value { font-size: 19px; font-weight: 650; color: var(--fg); }
  .g-stat-delta { font-size: 11.5px; color: var(--fg-dim); }
  .g-stat-delta.up { color: #7ee0a6; }
  .g-stat-delta.down { color: #ffb3b8; }

  .g-code {
    margin: 0; background: var(--bg-code); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px;
    line-height: 1.55; color: #cdd6e4; white-space: pre-wrap; word-break: break-word;
  }
  .g-json > summary { cursor: pointer; color: var(--fg-faint); font-size: 11.5px; }
  .g-diff { display: flex; flex-direction: column; gap: 6px; }
  .g-diff-path { font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim); }
  .g-diff-old, .g-diff-new { margin: 0; padding: 8px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
  .g-diff-old { background: #21161a; color: #ffb3b8; border: 1px solid #4b2830; }
  .g-diff-new { background: #14201a; color: #a9e8c4; border: 1px solid #274634; }
  .g-kv { display: flex; flex-direction: column; gap: 6px; }
  .g-kv-row { display: flex; gap: 10px; font-size: 12.5px; }
  .g-kv-key { color: var(--fg-faint); min-width: 84px; }
  .g-kv-value { color: var(--fg); }

  .g-callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; background: var(--bg-soft); }
  .g-callout.g-tone-success { border-left-color: #2c6047; }
  .g-callout.g-tone-warning { border-left-color: #6b5320; }
  .g-callout.g-tone-error { border-left-color: #6b2f36; }
  .g-callout-title { font-weight: 600; color: var(--fg); margin-bottom: 4px; font-size: 13px; }
  .g-callout-body { color: var(--fg-dim); font-size: 12.5px; white-space: pre-wrap; }

  .g-list { margin: 0; padding-left: 20px; }
  .g-list-item { margin: 4px 0; font-size: 13px; }
  .g-list-title { color: var(--fg); font-weight: 550; }
  .g-list-desc { color: var(--fg-dim); font-size: 12.5px; }

  .g-steps { display: flex; flex-direction: column; gap: 8px; }
  .g-step { display: flex; gap: 10px; align-items: flex-start; }
  .g-step-mark {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: var(--fg-dim);
  }
  .g-step.done .g-step-mark { border-color: #2c6047; color: #7ee0a6; }
  .g-step.active .g-step-mark { border-color: var(--accent); color: var(--accent); }
  .g-step-title { font-size: 13px; color: var(--fg); }
  .g-step-desc { font-size: 12px; color: var(--fg-faint); }

  .g-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .g-table th, .g-table td { border: 1px solid var(--line-soft); padding: 6px 10px; text-align: left; }
  .g-table th { background: var(--bg-soft); cursor: pointer; user-select: none; }
  .g-table th.asc::after { content: " ▲"; color: var(--accent); }
  .g-table th.desc::after { content: " ▼"; color: var(--accent); }

  .g-bars { display: flex; gap: 10px; align-items: flex-end; padding: 6px 2px; }
  .g-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .g-bar-track { width: 100%; height: 90px; display: flex; align-items: flex-end; background: var(--bg-soft); border-radius: 6px; }
  .g-bar-fill { width: 100%; border-radius: 6px 6px 0 0; min-height: 2px; }
  .g-bar-value { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }
  .g-bar-label { font-size: 11px; color: var(--fg-faint); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-svg { width: 100%; display: block; }
  .g-axis { stroke: var(--line); stroke-width: 1; }
  .g-grid { stroke: var(--line-soft); stroke-width: 1; }
  .g-tick { fill: var(--fg-faint); font-size: 10px; font-family: var(--mono); }
  .g-line-wrap { display: flex; flex-direction: column; gap: 6px; }
  .g-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--fg-dim); }
  .g-legend-col { flex-direction: column; }
  .g-legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .g-legend-swatch { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .g-donut-wrap { display: flex; gap: 16px; align-items: center; }
  .g-donut { width: 120px; flex: 0 0 120px; }
  .g-donut-track { stroke: var(--bg-soft); }
  .g-donut-total { fill: var(--fg); font-size: 13px; font-family: var(--mono); }
  .g-donut-label { fill: var(--fg-faint); font-size: 9px; }
  .g-plot-svg { cursor: grab; touch-action: none; }
  .g-sliders { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .g-slider-head { font-size: 11.5px; color: var(--fg-faint); }
  .g-slider-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .g-slider-name { color: var(--fg-dim); min-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .g-tabs { display: flex; flex-direction: column; gap: 10px; }

<body>

<aside>
  <div class="brand">
    <h1>📚 文档问答</h1>
    <p>上传文档 → 提问 → 实时查看思考与工具调用</p>
  </div>
  <div class="pane">
    <section>
      <h2>资料库 <span id="doc-count" class="meta"></span></h2>
      <div id="docs"></div>
    </section>

    <section>
      <h2>会话</h2>
      <div class="meta">session <code id="session-id">—</code></div>
      <div class="meta">model <code id="model-id">—</code></div>
